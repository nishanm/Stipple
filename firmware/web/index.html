<!DOCTYPE html>
<!-- SPDX-License-Identifier: GPL-3.0-or-later -->
<!-- The glucose clock's settings page: the same four tabs, the same words and
     the same order as the TC001 nightscout-clock page, so the clocks in one
     house are set up the same way. Everything else Stipple can do is on
     /advanced.html, one link away. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Glucose clock</title>
<link rel="stylesheet" href="/glucose.css">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body data-state="loading">

<header class="top">
  <div class="top-inner">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">BG</div>
      <div>
        <h1 id="device_name">Glucose clock</h1>
        <div class="brand-sub" id="device_sub">connecting&hellip;</div>
      </div>
    </div>
    <div class="pills" aria-live="polite">
      <span class="pill" id="pill_wifi"><i class="dot"></i>WiFi <b>&hellip;</b></span>
      <span class="pill" id="pill_time"><i class="dot"></i>Time <b>&hellip;</b></span>
      <span class="pill" id="pill_source"><i class="dot"></i>Source <b>&hellip;</b></span>
      <span class="pill" id="pill_reading"><i class="dot"></i>Reading <b>&hellip;</b></span>
    </div>
  </div>
  <nav class="tabs" role="tablist" aria-label="Settings">
    <button class="tab" role="tab" type="button" data-tab="display" aria-selected="true">Display</button>
    <button class="tab" role="tab" type="button" data-tab="glucose" aria-selected="false">Glucose</button>
    <button class="tab" role="tab" type="button" data-tab="alarms" aria-selected="false">Alarms</button>
    <button class="tab" role="tab" type="button" data-tab="system" aria-selected="false">WiFi &amp; system</button>
  </nav>
</header>

<div class="wrap" id="loading_screen">
  <div class="card center">
    <div class="spinner"></div>
    <p class="muted" id="loading_text">Loading settings from the clock&hellip;</p>
    <button class="btn" id="loading_retry" type="button" hidden>Try again</button>
  </div>
</div>

<main class="wrap" id="app" hidden>
  <section id="tab_display" role="tabpanel" aria-label="Display"></section>
  <section id="tab_glucose" role="tabpanel" aria-label="Glucose" hidden></section>
  <section id="tab_alarms" role="tabpanel" aria-label="Alarms" hidden></section>
  <section id="tab_system" role="tabpanel" aria-label="WiFi and system" hidden></section>
</main>

<div class="savebar" id="savebar" hidden>
  <span class="small" id="dirty_text">Unsaved changes</span>
  <button class="btn ghost" id="discard" type="button">Discard</button>
  <button class="btn primary" id="save" type="button">Save</button>
</div>

<div class="bottom">
  <nav role="tablist" aria-label="Settings">
    <button type="button" data-tab="display" aria-selected="true"><span class="ico" aria-hidden="true">&#9638;</span>Display</button>
    <button type="button" data-tab="glucose" aria-selected="false"><span class="ico" aria-hidden="true">&#128167;</span>Glucose</button>
    <button type="button" data-tab="alarms" aria-selected="false"><span class="ico" aria-hidden="true">&#128276;</span>Alarms</button>
    <button type="button" data-tab="system" aria-selected="false"><span class="ico" aria-hidden="true">&#9881;</span>System</button>
  </nav>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="/glucose.js"></script>
</body>
</html>
