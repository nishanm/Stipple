<!DOCTYPE html>
<!-- SPDX-License-Identifier: GPL-3.0-or-later -->
<!--
  A controller for a clock, served by the clock.

  Every control here is one POST to /api/v1/input, which has accepted all six
  controls with separate down/up phases since the API existed - the panel's
  own on-screen buttons already used it. Nothing about this page is a new
  protocol; it is the existing one with thumb-sized targets.

  Standalone rather than a tab in the main UI, and deliberately: this is held
  sideways in two hands a foot from the device, while that is read at a desk.
  Sharing a layout would compromise both.

  **It is laid out like the case.** The knob is on the left of the panel and
  the three buttons are on its right, in the order - M +, which is where they
  are on the hardware. That matters more than it sounds: somebody who learns
  "M is the way out" with their thumb here finds it in the same place on the
  device, and the middle button is the one control ADR 0024 guarantees a
  script can never take. A remote that taught the wrong muscle memory would
  be teaching it about the only control that always works.

  The knob is turned rather than tapped, for the same reason. It is a rotary
  encoder on the device and a drag-to-rotate dial here, so a rally feels like
  the thing it is imitating. Arrow keys are wired up as well, because a
  keyboard is a perfectly good gamepad when the phone is charging.

  Scripts receive these presses when they declare `# @input exclusive`
  (ADR 0024). Against anything else the controls do their ordinary jobs,
  which makes this a usable remote for a device across the room either way.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stipple — Controller</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="favicon.svg">
<style>
:root {
    --bg: #0d1117;
    --panel: #161b22;
    --line: #272e38;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #00beff;
    --danger: #f2545b;
}

* { box-sizing: border-box; }

html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;

    /* A controller that selects its own labels when you play fast, or scrolls
       the page under your thumb, is not a controller. */
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    overscroll-behavior: none;
    touch-action: manipulation;
}

body {
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
}

header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 14px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    flex: none;
}

header h1 {
    font-size: 14px;
    font-weight: 600;
    margin: 0;
    letter-spacing: .02em;
}

#status {
    margin-left: auto;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
}
#status.bad { color: var(--danger); }

main {
    flex: 1;
    display: grid;
    /* The knob side is narrower than the button side on the case, and the same
       proportion here keeps the two from reading as a symmetrical pair of
       d-pads. */
    grid-template-columns: 5fr 6fr;
    gap: 14px;
    padding: 14px;
    min-height: 0;
}

.cluster {
    display: grid;
    gap: 12px;
    min-height: 0;
}

/* Turn on top, press underneath: the dial is one control that does both, and
   splitting it is the only way to offer a hold on a thing you rotate. */
.cluster.knob { grid-template-rows: 1fr auto; }
.cluster.keys { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }

/* Where each cluster sits on the hardware, said once so the layout is not
   asking to be taken on faith. */
.where {
    grid-column: 1 / -1;
    margin: -4px 0 0;
    font-size: 11px;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: center;
}

/* --- the knob -------------------------------------------------------------
   Drawn round and turned by dragging, because that is what it is. The notch
   rotates with the thumb so the gesture has somewhere to land visually - a
   dial that does not move under a finger reads as broken long before anyone
   wonders whether the device received anything. */
#dial {
    position: relative;
    align-self: center;
    justify-self: center;
    /* Square, and never larger than the cell it is in. The page does not
       scroll, so a dial that overflowed would simply be cut off at the
       bottom - and the part that gets cut off is where the thumb rests. */
    width: 78vmin;
    max-width: 100%;
    max-height: 100%;
    aspect-ratio: 1;
    border-radius: 50%;
    border: 1px solid var(--line);
    background:
        radial-gradient(circle at 50% 38%, #1d2430 0%, #141a22 62%, #0f141b 100%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06);
    display: flex;
    align-items: center;
    justify-content: center;

    /* Without this a drag scrolls the page instead of turning the knob, and on
       a phone that is the whole interaction. */
    touch-action: none;
    cursor: grab;
}
#dial.turning {
    border-color: var(--accent);
    cursor: grabbing;
}

/* The ring of detent marks. Decorative, and it is what makes a circle read as
   something you turn rather than something you press. */
#dial::before {
    content: "";
    position: absolute;
    inset: 9%;
    border-radius: 50%;
    border: 1px dashed var(--line);
    opacity: .6;
}

#notch {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    /* Rotated by script. No transition: it tracks a thumb, and smoothing that
       would put the mark behind the finger. */
}
#notch::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 6%;
    width: 8px;
    height: 18%;
    margin-left: -4px;
    border-radius: 4px;
    background: var(--muted);
}
#dial.turning #notch::after { background: var(--accent); }

#dial .name {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    pointer-events: none;
}

/* --- the buttons --------------------------------------------------------- */
button.pad {
    -webkit-appearance: none;
    appearance: none;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--panel);
    color: var(--text);
    font: 600 26px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 0;
    transition: background 60ms linear, transform 60ms linear;
}

button.pad .name {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
}

/* Held, not tapped. A paddle needs to know the thumb is still down. */
button.pad.held {
    background: var(--accent);
    border-color: var(--accent);
    color: #00222e;
    transform: scale(.98);
}
button.pad.held .name { color: #00222e; }

/* M spans the pair above it, the way the middle button sits between - and +
   with nothing beside it. Outlined rather than filled: it is the way out, and
   the way out should not look like part of the game. */
button.pad.middle {
    grid-column: 1 / -1;
    border-style: dashed;
    font-size: 22px;
}

/* The knob's press. Shallow, because the dial above it is the control and this
   is the other thing that control does. */
button.pad.press { font-size: 20px; padding: 14px 0; }

footer {
    flex: none;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 14px 12px;
    font-size: 12px;
    color: var(--muted);
}
footer a { color: var(--muted); }
footer .note { margin-left: auto; text-align: right; }
</style>
</head>
<body>

<header>
    <h1>Controller</h1>
    <span id="status">ready</span>
</header>

<main>
    <!-- Left of the panel on the case, and left here. -->
    <div class="cluster knob">
        <div id="dial" role="slider" aria-label="Knob" tabindex="-1">
            <div id="notch"></div>
            <span class="name">turn</span>
        </div>
        <button class="pad press" data-control="press" data-mode="hold">●<span class="name">press</span></button>
        <p class="where">knob</p>
    </div>

    <!-- Right of the panel, in the order they are printed on it. -->
    <div class="cluster keys">
        <button class="pad" data-control="minus" data-mode="hold">−<span class="name">minus</span></button>
        <button class="pad" data-control="plus" data-mode="hold">+<span class="name">plus</span></button>
        <button class="pad middle" data-control="middle" data-mode="tap">M<span class="name">back</span></button>
        <p class="where">buttons</p>
    </div>
</main>

<footer>
    <a href="index.html">← Settings</a>
    <span class="note">Scripts receive these when they declare <code>@input exclusive</code>.</span>
</footer>

<script>
'use strict';

// Presses are fired and forgotten. Awaiting each one would serialise the
// controller behind the device's round trip, and a paddle that waits for an
// acknowledgement is a paddle that lags - the press has already happened in
// the player's hand either way. Failures surface in the status line instead.
var status = document.getElementById('status');
var failures = 0;

function report(ok, detail) {
    if (ok) {
        failures = 0;
        status.className = '';
        status.textContent = 'ready';
        return;
    }
    failures += 1;
    status.className = 'bad';
    status.textContent = detail + (failures > 1 ? ' (×' + failures + ')' : '');
}

function send(control, phase) {
    var body = { control: control };
    if (phase) { body.phase = phase; }

    fetch('/api/v1/input', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
        // So a press still leaves as the page is being backgrounded, which is
        // exactly when the last one of a session is sent.
        keepalive: true,
    }).then(function (response) {
        report(response.ok, 'HTTP ' + response.status);
    }).catch(function () {
        report(false, 'unreachable');
    });
}

function buzz(ms) {
    if (navigator.vibrate) { navigator.vibrate(ms); }
}

// --- buttons ---------------------------------------------------------------
//
// `hold` sends the press and the release separately, which is what lets
// somebody hold - / + for brightness or the knob for settings. `tap` sends a
// complete press, and M is the only one: there is nothing a held back button
// is bound to, and a way out that depends on how long you hold it is not one.
document.querySelectorAll('button.pad').forEach(function (pad) {
    var control = pad.dataset.control;
    var hold = pad.dataset.mode === 'hold';

    function press(event) {
        event.preventDefault();
        pad.classList.add('held');
        buzz(hold ? 8 : 15);
        send(control, hold ? 'down' : null);
    }

    function release(event) {
        event.preventDefault();
        if (!pad.classList.contains('held')) { return; }
        pad.classList.remove('held');
        if (hold) { send(control, 'up'); }
    }

    // Pointer events cover touch, mouse and pen in one path. `pointercancel`
    // and `pointerleave` matter as much as `pointerup`: a thumb that slides
    // off a button, or a call that arrives mid-game, must not leave the
    // device holding a key down for ever.
    pad.addEventListener('pointerdown', press);
    pad.addEventListener('pointerup', release);
    pad.addEventListener('pointercancel', release);
    pad.addEventListener('pointerleave', release);
    pad.addEventListener('contextmenu', function (e) { e.preventDefault(); });
});

// --- the knob --------------------------------------------------------------
//
// A detent is momentary: the API takes it as a single event with no phase,
// because a click of an encoder has no duration. So turning the dial is a
// matter of deciding when one has happened, and that is all this does.

var dial = document.getElementById('dial');
var notch = document.getElementById('notch');

// Twenty detents to a full turn. Chosen to be coarse enough that a deliberate
// nudge is one step rather than three, and fine enough that a sweep of the
// thumb crosses a screen.
var DEG_PER_DETENT = 18;

// A floor on how often a detent goes out. A fast spin can cross thirty in a
// second, and this device answers HTTP on the thread that draws the panel -
// so the limit is here, where the rotation is, rather than left for the
// firmware to absorb.
var MIN_DETENT_MS = 30;

var turning = false;
var lastAngle = 0;
var pending = 0;      // degrees turned and not yet spent on a detent
var shownAngle = 0;   // where the notch is drawn, which is every degree
var lastDetentAt = 0;

function angleOf(event) {
    var box = dial.getBoundingClientRect();
    var dx = event.clientX - (box.left + box.width / 2);
    var dy = event.clientY - (box.top + box.height / 2);
    // Screen y grows downward, so a growing angle is clockwise - which is
    // RotaryRight on the hardware.
    return Math.atan2(dy, dx) * 180 / Math.PI;
}

function drain() {
    if (Math.abs(pending) < DEG_PER_DETENT) { return; }

    var now = Date.now();
    if (now - lastDetentAt < MIN_DETENT_MS) {
        // Clamp rather than queue. Banking a spin's worth of detents would
        // keep the paddle moving after the thumb had stopped, which is worse
        // than losing a couple of steps out of a flick.
        var cap = DEG_PER_DETENT * 2;
        if (pending > cap) { pending = cap; }
        if (pending < -cap) { pending = -cap; }
        return;
    }

    var clockwise = pending > 0;
    pending -= clockwise ? DEG_PER_DETENT : -DEG_PER_DETENT;
    lastDetentAt = now;
    buzz(4);
    send(clockwise ? 'right' : 'left', null);
}

dial.addEventListener('pointerdown', function (event) {
    event.preventDefault();
    turning = true;
    lastAngle = angleOf(event);
    pending = 0;
    dial.classList.add('turning');
    // Capture, so a thumb that wanders off the circle mid-rally keeps turning
    // it instead of silently stopping.
    if (dial.setPointerCapture) { dial.setPointerCapture(event.pointerId); }
});

dial.addEventListener('pointermove', function (event) {
    if (!turning) { return; }
    event.preventDefault();

    var angle = angleOf(event);
    var delta = angle - lastAngle;
    // Shortest way round, so crossing the top of the dial is not a 359° jump
    // in the wrong direction.
    if (delta > 180) { delta -= 360; }
    if (delta < -180) { delta += 360; }
    lastAngle = angle;

    pending += delta;
    shownAngle += delta;
    notch.style.transform = 'rotate(' + shownAngle + 'deg)';
    drain();
});

function stopTurning(event) {
    if (!turning) { return; }
    if (event) { event.preventDefault(); }
    turning = false;
    pending = 0;
    dial.classList.remove('turning');
}

dial.addEventListener('pointerup', stopTurning);
dial.addEventListener('pointercancel', stopTurning);
dial.addEventListener('contextmenu', function (e) { e.preventDefault(); });

// --- keyboard --------------------------------------------------------------
var keys = {
    ArrowLeft: 'left', ArrowRight: 'right',
    ArrowUp: 'plus', ArrowDown: 'minus',
    ' ': 'press', Enter: 'press', Escape: 'middle',
};

function isDetent(control) { return control === 'left' || control === 'right'; }
function isTap(control) { return control === 'middle'; }

var down = {};

window.addEventListener('keydown', function (event) {
    var control = keys[event.key];
    if (!control) { return; }
    event.preventDefault();

    // Autorepeat is welcome on the detents and nowhere else. Holding an arrow
    // is how you turn a knob you have no thumb on, and letting the key repeat
    // is a better imitation of that than one step per press. A button, by
    // contrast, is mid-press while it is held - repeating it would send a
    // second `down` with no `up` between, and the firmware would be measuring
    // a hold that had already restarted.
    if (down[event.key] && !isDetent(control)) { return; }
    down[event.key] = true;

    send(control, isDetent(control) || isTap(control) ? null : 'down');
});

window.addEventListener('keyup', function (event) {
    var control = keys[event.key];
    if (!control || !down[event.key]) { return; }
    delete down[event.key];
    event.preventDefault();
    if (!isDetent(control) && !isTap(control)) { send(control, 'up'); }
});

// Anything still held when the page goes away is released, for the same
// reason pointercancel is handled: a device left with a key down is a device
// that looks broken.
window.addEventListener('blur', function () {
    stopTurning(null);
    document.querySelectorAll('button.pad.held').forEach(function (pad) {
        pad.classList.remove('held');
        if (pad.dataset.mode === 'hold') { send(pad.dataset.control, 'up'); }
    });
    Object.keys(down).forEach(function (key) {
        var control = keys[key];
        delete down[key];
        if (!isDetent(control) && !isTap(control)) { send(control, 'up'); }
    });
});
</script>
</body>
</html>
