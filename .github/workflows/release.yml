name: Release

# Cutting a release is one button.
#
# Run this workflow from the Actions tab, pick how far to bump, and it works
# out the version, writes it into the two files that have to agree, renames
# the changelog's `## Unreleased` heading to it, runs the whole gate set,
# packages, commits the bump to main, tags it and publishes.
#
# **Nothing is written until everything has passed.** The bump is applied to
# each job's working tree so the artefacts carry the right version, and only
# the publish job commits and tags. A run that fails leaves main exactly as it
# was, which is the property that makes a one-button release safe.
#
# Pushing a `v*` tag by hand still works and still releases, for the case
# where somebody wants to cut a release from something other than main's head.
#
# What is deliberately *not* here is update.img. A res image contains Ulanzi's
# libzkgui.so - seven and a half megabytes of their firmware - so publishing
# one would be redistributing it. The image-builder artifact is the honest
# substitute: it carries our half and builds the rest against a capture of the
# device it is going to be installed on, which never leaves that machine.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Which part of the version to raise'
        type: choice
        default: patch
        options: [patch, minor, major]
      version:
        description: 'Exact version instead (x.y.z). Overrides the choice above.'
        type: string
        default: ''
      publish:
        description: 'Publish it. Unticked builds and packages and releases nothing.'
        type: boolean
        default: true
  push:
    tags: ['v*']

# Distinct from ci.yml's group on purpose: a release must not cancel the CI run
# it depends on, and a half-published release is worse than a slow one.
concurrency:
  group: stipple-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Works out what version this is, and proves it can be released before
  # anything is built.
  #
  # The version lives in three places that drift silently: project(VERSION) in
  # CMakeLists.txt, kVersion in Version.h - what the device reports over
  # /api/v1/version and paints on the splash - and the git tag. A release whose
  # binary reports a different version than its tag is unsupportable.
  #
  # For a dispatch run this job *chooses* the version rather than checking one,
  # by raising the highest released tag. The files are then written to match in
  # every later job, so there is nothing to disagree about - which is a better
  # guarantee than checking three things by hand and is the point of doing it
  # this way.
  plan:
    name: Plan the release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      tag: ${{ steps.pick.outputs.tag }}
      bump: ${{ steps.pick.outputs.bump }}
      publish: ${{ steps.pick.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Every tag, because the next version is derived from the highest one
          # and a shallow clone has none of them.
          fetch-depth: 0

      - id: pick
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # Tagged by hand. The tag is the source of truth, the files are
            # checked against it, and nothing is rewritten.
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
            bump=false
            publish=true

            cmake_version="$(sed -nE 's/^[[:space:]]*VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt | head -1)"
            header_version="$(sed -nE 's/.*kVersion[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' firmware/include/stipple/core/Version.h | head -1)"
            fail=0
            [ "$version" = "$cmake_version" ] || { echo "::error::tag ${tag} disagrees with CMakeLists.txt ${cmake_version}"; fail=1; }
            [ "$version" = "$header_version" ] || { echo "::error::tag ${tag} disagrees with Version.h ${header_version}"; fail=1; }
            [ "$fail" -eq 0 ] || exit 1
          else
            bump=true
            publish='${{ inputs.publish }}'
            asked='${{ inputs.version }}'

            if [ -n "$asked" ]; then
              version="$asked"
              if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                echo "::error::'${version}' is not a version"
                exit 1
              fi
            else
              # The highest tag, not the highest number in a file: a file can
              # be ahead of what was actually released, and releasing the same
              # version twice is the failure worth preventing.
              latest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sed 's/^v//' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)"
              if [ -z "$latest" ]; then
                latest="0.0.0"
                echo "::notice::no release tags yet; counting from 0.0.0"
              fi
              # Parameter expansion rather than a heredoc: a heredoc inside a
              # YAML block scalar only works while its terminator lands at
              # column zero after YAML strips the block indent, which is a
              # thing that breaks when somebody re-indents the job.
              major="${latest%%.*}"
              rest="${latest#*.}"
              minor="${rest%%.*}"
              patch="${rest##*.}"
              case '${{ inputs.bump }}' in
                major) major=$((major + 1)); minor=0; patch=0 ;;
                minor) minor=$((minor + 1)); patch=0 ;;
                *)     patch=$((patch + 1)) ;;
              esac
              version="${major}.${minor}.${patch}"
              echo "::notice::latest release is ${latest}; ${{ inputs.bump }} makes it ${version}"
            fi

            tag="v${version}"
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "::error::${tag} already exists. Pick a different version, or bump further."
              exit 1
            fi
          fi

          echo "tag       ${tag}"
          echo "version   ${version}"
          echo "bump      ${bump}"
          echo "publish   ${publish}"

          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "bump=${bump}"
            echo "publish=${publish}"
          } >> "$GITHUB_OUTPUT"

      # The notes are checked before anything is built. A release with no
      # notes is one nobody can decide whether to install, and finding that out
      # after twenty minutes of cross-compiling wastes the twenty minutes.
      #
      # `## Unreleased` counts: the bump renames it, which is the whole point
      # of writing notes while the work is fresh instead of at release time.
      - name: Check there are notes
        run: |
          set -euo pipefail
          version='${{ steps.pick.outputs.version }}'
          if awk -v ver="## ${version}" 'index($0, ver) == 1 { f = 1 } END { exit !f }' CHANGELOG.md; then
            echo "CHANGELOG.md has a '## ${version}' section"
          elif grep -qiE '^## +Unreleased' CHANGELOG.md; then
            echo "CHANGELOG.md has '## Unreleased', which becomes '## ${version}'"
          else
            echo "::error::CHANGELOG.md has neither '## ${version}' nor '## Unreleased'"
            exit 1
          fi

  # The full gate set, not a copy of it. If CI is weakened or strengthened, the
  # release path moves with it.
  verify:
    name: Verify
    needs: plan
    uses: ./.github/workflows/ci.yml

  package:
    name: Package
    needs: [plan, verify]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # Applied to the working tree, not committed. The artefacts have to
      # report the version they are being released as, and main must not carry
      # a bump for a release that has not passed yet - so every job that needs
      # the new version writes it locally and only `publish` makes it
      # permanent.
      - name: Write the version
        if: needs.plan.outputs.bump == 'true'
        run: bash tooling/release/bump.sh "${VERSION}"

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          # Same pin as ci.yml, per blueprint §32. A release built on a
          # different toolchain than CI tested is not the artifact CI verified.
          version: 3.1.64

      # kBuildCommit ships as the literal "unknown" so an unstamped build is
      # obvious rather than plausible. Release builds are the one place it gets
      # a real value.
      - name: Stamp build commit
        run: |
          set -euo pipefail
          header=firmware/include/stipple/core/Version.h
          sed -i -E "s/(kBuildCommit[[:space:]]*=[[:space:]]*\")unknown(\")/\1${GITHUB_SHA}\2/" "$header"
          grep -q "${GITHUB_SHA}" "$header" || { echo "::error::failed to stamp kBuildCommit"; exit 1; }

      - name: Build emulator
        run: |
          emcmake cmake -S . -B build/emulator \
            -DSTIPPLE_BUILD_EMULATOR=ON -DSTIPPLE_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build/emulator

      # The WASM module is loaded through Emscripten glue whose export list is
      # generated at link time; a missing export is invisible to the C++ suite
      # and fatal in the browser. dev.ps1 has this verb locally, so a release
      # should not skip it.
      - name: Verify emulator module
        run: node simulator/web/tools/verify.mjs

      # Built here, from the bumped tree, and not taken from the CI run.
      #
      # **This shipped a wrong binary once and the failure was silent.** The
      # release used to download CI's `libstipple-so` artifact, which is built
      # by the `verify` job from the commit as it stands - before the bump
      # exists, because the bump is applied to each job's own working tree and
      # only committed at publish time. So the file was renamed
      # `libstipple-0.2.4.so` while the binary inside reported 0.2.3, and
      # installing it looked like a no-op: the device took the update and went
      # on saying the old version, through a reboot.
      #
      # Rebuilding here costs about two minutes and makes the artifact the
      # thing the version says it is. CI still builds and checks its own copy,
      # which is what gates the release; this is the copy that ships.
      - name: Build the pinned cross toolchain
        run: docker build -t stipple-cross:bullseye -f tooling/cross/Containerfile.bullseye tooling/cross

      - name: Build the device library
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/src" stipple-cross:bullseye bash -c "
            cd /src &&
            cmake -S . -B build/device-arm -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE=/src/cmake/toolchains/arm-linux-gnueabihf.cmake \
              -DCMAKE_BUILD_TYPE=Release -DSTIPPLE_BUILD_TESTS=OFF \
              -DSTIPPLE_WARNINGS_AS_ERRORS=ON -DSTIPPLE_DEVICE_BUILD=ON &&
            cmake --build build/device-arm --target stipple_startup"
          mkdir -p dist
          cp build/device-arm/firmware/libstipple.so dist/libstipple.so

      # The same load-safety checks CI runs, on the copy that actually ships.
      # A library that verifies here and fails at dlopen on the device is a
      # failure only visible over ADB; that happened during bring-up and cost
      # two flashes.
      - name: Check the library can load on a device
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/src" stipple-cross:bullseye bash -c '
            cd /src
            lib=dist/libstipple.so
            arm-linux-gnueabihf-readelf -d "$lib" | grep NEEDED

            if arm-linux-gnueabihf-readelf -V "$lib" | grep -q GLIBCXX; then
              echo "::error::libstipple.so wants GLIBCXX symbols the device does not have"
              exit 1
            fi

            worst=$(arm-linux-gnueabihf-readelf -V "$lib" | grep -o "GLIBC_[0-9.]*" | sort -u -V | tail -1)
            echo "highest glibc requirement: $worst"
            newest=$( { echo "$worst"; echo GLIBC_2.30; } | sort -V | tail -1 )
            if [ "$newest" != "GLIBC_2.30" ]; then
              echo "::error::libstipple.so needs $worst; the TC002 has GLIBC_2.30"
              exit 1
            fi
          '

      # The check that would have caught the wrong binary in seconds.
      #
      # kVersion is what the device reports over /api/v1/version and paints on
      # the splash, and it is compiled in - so if the string is not in the
      # library, the library is not this release whatever the filename says.
      - name: Check the library reports this version
        run: |
          set -euo pipefail

          # kVersion is compiled in - it is what the device reports over
          # /api/v1/version and paints on the splash - so if the string is
          # not in the library, the library is not this release whatever
          # the filename says.
          #
          # Matched as a whole version rather than a substring, and both
          # halves of that matter. `grep "0.2.4"` treats the dots as
          # wildcards, so it matches "0x2y4"; and unanchored, "0.2.4"
          # matches inside "10.2.42". The first version of this check did
          # both and passed on the very binary it was written to reject.
          versions=$(grep -aoE '(^|[^0-9.])[0-9]+\.[0-9]+\.[0-9]+([^0-9.]|$)' dist/libstipple.so \
                     | grep -aoE '[0-9]+\.[0-9]+\.[0-9]+' | sort -u)

          if echo "$versions" | grep -qxF "${VERSION}"; then
            echo "libstipple.so reports ${VERSION}"
          else
            echo "::error::libstipple.so does not report ${VERSION} - it is not this release"
            echo "versions found in it:"
            echo "$versions" | head -20
            exit 1
          fi
      - name: Assemble artifacts
        run: |
          set -euo pipefail
          mkdir -p dist/emulator

          for f in index.html styles.css app.js stipple-core.js stipple-core.wasm; do
            cp "simulator/web/public/$f" dist/emulator/
          done

          zip -j -q "dist/stipple-emulator-${VERSION}.zip" dist/emulator/*

          # Renamed so a downloaded file says what it is and which version it
          # is. The device does not care about the name: installing it is an
          # upload through Settings > Firmware, which writes it where the shim
          # looks.
          mv dist/libstipple.so "dist/libstipple-${VERSION}.so"

          # The image builder: everything needed to produce a flashable
          # update.img except the one thing that cannot be published.
          #
          # A res image contains Ulanzi's libzkgui.so. Shipping one would be
          # redistributing their firmware, so this ships our half - the shim
          # source, the library, and the script that rebuilds a capture with
          # them - and the vendor's half is taken from the user's own device,
          # where it already legitimately is.
          mkdir -p dist/imagebuilder
          cp tooling/imgtool/buildres.sh tooling/imgtool/imgtool.py dist/imagebuilder/
          cp firmware/tools/startup_shim/main.cpp dist/imagebuilder/startup_shim.cpp
          cp "dist/libstipple-${VERSION}.so" dist/imagebuilder/libstipple.so
          cp docs/install.md dist/imagebuilder/README.md
          zip -j -q "dist/stipple-imagebuilder-${VERSION}.zip" dist/imagebuilder/*

          # Everything the manifest is about to describe must already exist.
          #
          # It did not, once: the manifest was written before the image
          # builder was zipped, so sha256sum and stat both failed, their empty
          # output left `"bytes": ,` in the file, and the whole thing surfaced
          # as a JSON decode error pointing at line 19 - which says nothing
          # about what actually went wrong.
          for f in "dist/libstipple-${VERSION}.so" \
                   "dist/stipple-imagebuilder-${VERSION}.zip" \
                   "dist/stipple-emulator-${VERSION}.zip"; do
            [ -f "$f" ] || { echo "::error::manifest would describe a missing file: $f"; exit 1; }
          done

          api_version="$(sed -nE 's/.*kApiVersion[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' firmware/include/stipple/core/Version.h | head -1)"

          # Blueprint §28's manifest shape, with the honesty fields this stage
          # needs: nothing here installs onto hardware, and a manifest that
          # omitted that would read as though it did.
          cat > dist/manifest.json <<EOF
          {
            "channel": "dev",
            "version": "${VERSION}",
            "commit": "${GITHUB_SHA}",
            "buildDate": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "apiVersion": ${api_version},
            "hardware": [],
            "installable": true,
            "note": "Updates an existing STIPPLE device through Settings > Firmware. It does not install STIPPLE onto a stock device - that needs a res image built from your own device's capture, which cannot be published because it contains vendor firmware. See docs/install.md.",
            "artifacts": [
              {
                "name": "stipple-emulator-${VERSION}.zip",
                "sha256": "$(sha256sum "dist/stipple-emulator-${VERSION}.zip" | cut -d' ' -f1)",
                "bytes": $(stat -c%s "dist/stipple-emulator-${VERSION}.zip")
              },
              {
                "name": "stipple-imagebuilder-${VERSION}.zip",
                "sha256": "$(sha256sum "dist/stipple-imagebuilder-${VERSION}.zip" | cut -d' ' -f1)",
                "bytes": $(stat -c%s "dist/stipple-imagebuilder-${VERSION}.zip"),
                "target": "tc002"
              },
              {
                "name": "libstipple-${VERSION}.so",
                "sha256": "$(sha256sum "dist/libstipple-${VERSION}.so" | cut -d' ' -f1)",
                "bytes": $(stat -c%s "dist/libstipple-${VERSION}.so"),
                "target": "tc002"
              }
            ]
          }
          EOF

          python3 -c "import json,sys; json.load(open('dist/manifest.json'))" \
            || { echo "::error::generated manifest.json is not valid JSON"; exit 1; }

          ( cd dist && sha256sum "stipple-emulator-${VERSION}.zip" "stipple-imagebuilder-${VERSION}.zip" "libstipple-${VERSION}.so" manifest.json > SHA256SUMS )
          cat dist/SHA256SUMS

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stipple-release-${{ env.VERSION }}
          path: dist/

      # Said out loud, because "Publish release — Skipped" in the job list
      # looks like something went wrong rather than like the answer.
      - name: Note what happens next
        if: needs.plan.outputs.publish != 'true'
        run: |
          echo "::notice::Built and packaged ${VERSION}, and published nothing:"
          echo "::notice::this run had 'Publish it' unticked."
          echo "::notice::Run it again with the box ticked to cut the release." 

      - name: Upload Pages bundle
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/emulator

  publish:
    name: Publish release
    needs: [plan, package]
    # Everything has passed by the time this runs, which is the property that
    # makes the bump safe to commit here and nowhere earlier.
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A branch, not the detached head a default checkout leaves on a tag
          # run: the bump has to be committed somewhere that moves.
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      # The bump, made permanent. This is the only write to the repository in
      # the whole workflow, and it happens after the gate set, the cross-build
      # and the packaging have all passed - so a run that fails leaves main
      # exactly as it was.
      #
      # No [skip ci] marker needed: a commit pushed with GITHUB_TOKEN does not
      # start another workflow run, which is GitHub's loop protection doing
      # what is wanted here for once.
      - name: Commit the version bump
        if: needs.plan.outputs.bump == 'true'
        run: |
          set -euo pipefail
          bash tooling/release/bump.sh "${VERSION}"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "::notice::the tree already said ${VERSION}; nothing to commit"
          else
            git add CMakeLists.txt firmware/include/stipple/core/Version.h CHANGELOG.md
            git commit -m "Release ${VERSION}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - uses: actions/download-artifact@v4
        with:
          name: stipple-release-${{ needs.plan.outputs.version }}
          path: dist

      # The section for this version, lifted out of CHANGELOG.md.
      #
      # Written by hand and read from the file rather than generated from
      # commit subjects: a changelog is for somebody deciding whether to
      # install this, and a list of commits answers a different question.
      #
      # A missing section stops the release. Notes that quietly fall back to
      # boilerplate are how a release goes out describing the previous one.
      - name: Extract the changelog
        run: |
          set -euo pipefail
          awk -v ver="## ${VERSION}" '
            index($0, ver) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > changes.md

          if [ ! -s changes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${VERSION}"
            exit 1
          fi
          echo "--- what the release will say ---"
          cat changes.md

      - name: Write release notes
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          ## Stipple ${VERSION}

          $(cat changes.md)

          ---

          ## Downloads

          > **Use at your own risk.** STIPPLE replaces firmware on hardware it
          > was not designed for. It can leave your device unusable and will
          > probably void your warranty. It comes with **no warranty and no
          > liability** (GPL-3.0 sections 15-16). Do not install it on a
          > device you are not prepared to lose.

          ### \`libstipple-${VERSION}.so\` — for a device already running STIPPLE

          Install it through **Settings → Firmware** in the device's web UI.
          It is written beside the running version and renamed into place, so
          a failed upload changes nothing, and the previous version is kept so
          you can go back. Nothing is flashed.

          Built in the pinned toolchain and checked, in CI, that it can
          actually load on the hardware: 32-bit ARM, no \`GLIBCXX\` symbols,
          and nothing newer than \`GLIBC_2.30\`. A library that fails those is
          not published, because it would flash and verify perfectly and then
          fail at \`dlopen\` where only ADB can see it.

          **This does not install STIPPLE onto a stock device.** That needs a
          \`res\` image built from a capture of your own device, which cannot
          be published — it contains Ulanzi's firmware. See
          [docs/install.md](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/install.md).

          ### \`stipple-imagebuilder-${VERSION}.zip\` — for a stock device

          Everything needed to build a flashable \`update.img\` **except the
          one part that cannot be published**: a \`res\` image contains
          Ulanzi's own \`libzkgui.so\`, so shipping one would be
          redistributing their firmware.

          So this carries our half — the boot shim, the library, and the
          script that rebuilds an image with them — and takes the vendor's
          half from a capture of your own device, where it already
          legitimately is.

          **Capture first.** It is the only copy of your device's original
          firmware that will ever exist.

          ### \`stipple-emulator-${VERSION}.zip\` — no hardware needed

          The same framebuffer, font engine, scene renderer, app scheduler and
          API router the device runs - including the same Berry interpreter, so
          a script tried in a browser behaves the way it will on the panel.
          Only the platform adapter differs.

          ### Try it

          No hardware and no time limit. Unpack
          \`stipple-emulator-${VERSION}.zip\` and serve the directory over HTTP:

          \`\`\`
          python -m http.server 8080
          \`\`\`

          Then open <http://localhost:8080/>. \`file://\` will not work — the
          WASM module needs a real MIME type and a same-origin fetch.

          ### Verify

          \`\`\`
          sha256sum -c SHA256SUMS
          \`\`\`

          \`manifest.json\` carries the version, commit, API version and
          artifact digests.
          EOF

      - name: Create release
        run: |
          set -euo pipefail

          # Every file the notes describe has to actually be attached.
          #
          # This list previously omitted libstipple-*.so while the notes spent
          # four paragraphs on it, so every release promised a download it did
          # not carry. Checked rather than trusted, because the failure is
          # silent: the release publishes, looks complete, and only the person
          # trying to install it finds out.
          assets=(
            "dist/libstipple-${VERSION}.so"
            "dist/stipple-imagebuilder-${VERSION}.zip"
            "dist/stipple-emulator-${VERSION}.zip"
            "dist/manifest.json"
            "dist/SHA256SUMS"
          )
          for a in "${assets[@]}"; do
            [ -f "$a" ] || { echo "::error::missing release asset: $a"; exit 1; }
          done

          # 0.x is development, so never "latest stable". Prerelease stays
          # until the interfaces stop moving.
          # --target creates the tag as part of creating the release, so
          # there is no second push to get wrong and no window where a
          # tag exists for a release that does not.
          gh release create "${TAG}" \
            --target "$(git rev-parse HEAD)" \
            --title "Stipple ${VERSION}" \
            --notes-file notes.md \
            --prerelease \
            "${assets[@]}"

  # Opt-in, and deliberately so: this is the step that makes the emulator
  # public. Enable Pages for the repository (Settings -> Pages -> Source:
  # GitHub Actions), then set the repository variable STIPPLE_PAGES to "true".
  # Until both are done the job is skipped rather than failed, so a release
  # does not go red over a publishing channel nobody asked for yet.
  # Pages moved to its own workflow (.github/workflows/pages.yml). The job
  # that used to live here called deploy-pages without ever uploading an
  # artifact, so it could only ever have failed, and the site is now more than
  # the emulator anyway.
