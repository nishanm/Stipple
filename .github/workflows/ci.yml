name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml calls this instead of re-listing the gates, so a tagged build
  # cannot pass through a weaker set of checks than main does.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # A golden fixture that is absent in CI was never committed. Locally the
  # harness creates missing fixtures; here that must be an error instead.
  STIPPLE_STRICT_GOLDEN: "1"

jobs:
  host-tests:
    name: Host tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # The presets pin Ninja so host, CI and developer machines all produce the
      # same build. Ninja ships with the Visual Studio C++ workload on Windows
      # but must be installed explicitly on Linux.
      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # Ninja invokes link.exe directly and needs the MSVC environment; without
      # it the toolchain mismatches architecture and every CRT symbol fails to
      # resolve.
      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # The device web UI has no build step, so nothing else would notice a
      # call to a function that an edit removed - and that shipped a page which
      # died on load. Cheap, and it runs before the long C++ build.
      - name: Check the web UI
        if: runner.os == 'Linux'
        run: node tooling/web/check-app.mjs

      # The only thing worse than no API documentation is documentation that
      # is confidently wrong. This reads the router and openapi.yaml and
      # insists they describe the same routes.
      - name: Check the API specification
        if: runner.os == 'Linux'
        run: python3 tooling/api/check-openapi.py

      # The website draws real golden-image frames and sets its clock in the
      # device's own font, both from generated data - exactly the kind of
      # thing that rots silently, because a broken generator still renders
      # something.
      - name: Check the website's panel data
        if: runner.os == 'Linux'
        run: |
          python3 tooling/site/build-frames.py
          node tooling/site/check-site.mjs

      # The shop page is generated from scripts/, so a script added without a
      # `# name:` or `# summary:` header fails here rather than being
      # published unchecked.
      #
      # **It builds the page and throws it away.** The page used to be
      # committed and this step diffed against it, which quietly broke the
      # submission promise: adding a script is supposed to be one file and a
      # pull request, and that check meant every contributor also had to run
      # a Python script and commit two hundred lines of generated HTML they
      # had no reason to expect. The Pages job rebuilds it on every deploy,
      # so the committed copy was never the one anybody read.
      - name: Check the script shop builds
        if: runner.os == 'Linux'
        run: python3 tooling/site/build-shop.py

      # Same reason: not to compare against a committed file, but because the
      # renderer refuses markup it does not understand. A heading style or a
      # nested link that it cannot handle fails here, on the pull request that
      # wrote it, rather than silently on the published page.
      - name: Check the reference pages build
        if: runner.os == 'Linux'
        run: python3 tooling/site/build-docs.py

      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci

      - name: Test
        run: ctest --preset ci

      # The memory-budget guards (blueprint §38) only assert in a release build:
      # MSVC's debug STL allocates an iterator-debug proxy per container, which
      # swamps the measurement. Without this step that guard would be inert.
      - name: Build and test release
        run: |
          cmake --preset host-release
          cmake --build --preset host-release
          ctest --test-dir build/host-release --output-on-failure

      - name: Upload golden-image diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-diffs-${{ matrix.os }}
          path: firmware/tests/testdata/_failed/
          if-no-files-found: ignore

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: cmake --preset sanitize -DSTIPPLE_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset sanitize

      - name: Test
        run: ctest --test-dir build/sanitize --output-on-failure

  device-arm:
    name: Device cross-build (ARMv7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The §53 boundary is a claim until something proves it. Cross-compiling
      # stipple_core for the target and running it is that proof, and it costs a
      # couple of minutes against the alternative of discovering a host-only
      # dependency with a device on the bench.
      - name: Install cross toolchain and ARM emulation
        run: |
          sudo apt-get update
          sudo apt-get install -y crossbuild-essential-armhf ninja-build qemu-user-static

      - name: Configure
        run: cmake --preset device-arm

      - name: Build
        run: cmake --build --preset device-arm

      - name: Check what the binary depends on
        run: |
          cd build/device-arm/firmware
          file stipple_device_smoke
          # Static by design: a dynamically linked binary from a modern distro
          # needs GLIBC_2.34 just for __libc_start_main, which an embedded
          # SigmaStar device is unlikely to have. See firmware/CMakeLists.txt.
          if readelf -d stipple_device_smoke | grep -q NEEDED; then
            echo "::error::the device binary gained a shared library dependency"
            readelf -d stipple_device_smoke | grep NEEDED
            exit 1
          fi
          echo "stripped size: $(arm-linux-gnueabihf-strip -o /tmp/s stipple_device_smoke && stat -c %s /tmp/s) bytes"

      - name: Run it on ARM
        run: qemu-arm-static build/device-arm/firmware/stipple_device_smoke

  device-library:
    name: Device library (libstipple.so)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Built in the pinned container and not with the runner's toolchain,
      # and this is not fussiness.
      #
      # `libstipple.so` is the artifact people install, so it has to load on a
      # device running glibc 2.30 and libstdc++.so.6.0.26. Every modern distro
      # toolchain emits references that are newer than that - the job above
      # gets away with it only because its binary is static. A library built
      # on ubuntu-latest flashes, verifies, and then fails at dlopen with a
      # message only visible over ADB. That happened during bring-up and cost
      # two flashes.
      - name: Build the pinned cross toolchain
        run: docker build -t stipple-cross:bullseye -f tooling/cross/Containerfile.bullseye tooling/cross

      - name: Build
        run: |
          docker run --rm -v "$PWD:/src" stipple-cross:bullseye bash -c "
            cd /src &&
            cmake -S . -B build/device-arm -G Ninja               -DCMAKE_TOOLCHAIN_FILE=/src/cmake/toolchains/arm-linux-gnueabihf.cmake               -DCMAKE_BUILD_TYPE=Release -DSTIPPLE_BUILD_TESTS=OFF               -DSTIPPLE_WARNINGS_AS_ERRORS=ON -DSTIPPLE_DEVICE_BUILD=ON &&
            cmake --build build/device-arm --target stipple_startup"

      # The guard that would have caught the bring-up failure in seconds.
      - name: Check it can actually load on the device
        run: |
          docker run --rm -v "$PWD:/src" stipple-cross:bullseye bash -c '
            cd /src
            lib=build/device-arm/firmware/libstipple.so
            arm-linux-gnueabihf-readelf -d "$lib" | grep NEEDED

            # The device has libstdc++.so.6.0.26, whose newest symbol set is
            # GLIBCXX_3.4.26. Every container here is newer, so the C++
            # runtime is linked statically and none of it may appear.
            if arm-linux-gnueabihf-readelf -V "$lib" | grep -q GLIBCXX; then
              echo "::error::libstipple.so wants GLIBCXX symbols the device does not have"
              arm-linux-gnueabihf-readelf -V "$lib" | grep -o "GLIBCXX_[0-9.]*" | sort -u
              exit 1
            fi

            # glibc 2.30 is what the device runs. Anything newer fails to load.
            worst=$(arm-linux-gnueabihf-readelf -V "$lib" | grep -o "GLIBC_[0-9.]*" | sort -u -V | tail -1)
            echo "highest glibc requirement: $worst"
            newest=$( { echo "$worst"; echo GLIBC_2.30; } | sort -V | tail -1 )
            if [ "$newest" != "GLIBC_2.30" ]; then
              echo "::error::libstipple.so needs $worst; the TC002 has GLIBC_2.30"
              exit 1
            fi

            arm-linux-gnueabihf-readelf -h "$lib" | grep -E "Type|Machine"
          '

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: libstipple-so
          path: build/device-arm/firmware/libstipple.so
          if-no-files-found: error

  emulator:
    name: Browser emulator (WASM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          # Pinned, per blueprint §32: CI must never pull "latest".
          version: 3.1.64

      - name: Configure
        run: emcmake cmake -S . -B build/emulator -DSTIPPLE_BUILD_EMULATOR=ON -DSTIPPLE_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/emulator

      - name: Upload emulator
        uses: actions/upload-artifact@v4
        with:
          name: stipple-emulator
          path: |
            simulator/web/public/index.html
            simulator/web/public/styles.css
            simulator/web/public/app.js
            simulator/web/public/stipple-core.js
            simulator/web/public/stipple-core.wasm
