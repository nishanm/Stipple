# SPDX-License-Identifier: GPL-3.0-or-later
#
# Builds and publishes the website.
#
# Everything there is generated from the repository rather than maintained
# beside it:
#
#   /            the landing page, drawing real golden-image frames
#   /shop/       scripts/, listed, with previews rendered by the real engine
#   /scripting/  docs/scripting.md, rendered
#   /mqtt/       docs/mqtt.md, rendered
#   /api/        openapi.yaml, rendered
#
# Nothing here is a mockup or a screenshot, which is the point: if the
# firmware changed and the page looked wrong, a test would already be failing.
#
# The emulator is not published. It was, and it cost this job an Emscripten
# toolchain and a WebAssembly build on every run to serve a page almost
# nobody reached from here - the useful place for it is `dev.ps1 serve`,
# where somebody is already working on the thing. Dropping it took the job
# from two builds to one.
#
# Requires the repository's Pages source to be set to "GitHub Actions"
# (Settings > Pages > Build and deployment > Source). Without that,
# deploy-pages has nowhere to publish and fails with a permissions error that
# does not say so.

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # Regenerated rather than committed-and-trusted, so the page always
      # shows the frames the current tests verify.
      - name: Generate the panel data
        run: python3 tooling/site/build-frames.py

      - name: Check the panel data
        run: node tooling/site/check-site.mjs

      # The reference documents are the source of truth and stay in docs/;
      # these pages are the same words for a second audience. Rendering them
      # here rather than committing HTML keeps one copy of the text.
      - name: Render the reference pages
        run: python3 tooling/site/build-docs.py

      # Generated from scripts/, so the published page lists what the
      # repository actually holds rather than whatever was committed last.
      - name: Build the script shop
        run: python3 tooling/site/build-shop.py

      # The previews are real frames from the real engine, which means
      # building it. A preview drawn any other way would be a picture of
      # something that does not exist, and the first time the two disagreed
      # the page would be wrong with nothing to catch it.
      - name: Render the script previews
        run: |
          set -euo pipefail
          cmake --preset host-release
          cmake --build --preset host-release --target stipple_tests
          mkdir -p build/frames
          STIPPLE_SHOP_FRAMES="$PWD/build/frames"             ./build/host-release/firmware/tests/stipple_tests ShopScripts.WriteFramesOnRequest
          python3 tooling/site/build-previews.py build/frames
          mkdir -p build/frames-defaults
          STIPPLE_DEFAULT_FRAMES="$PWD/build/frames-defaults" ./build/host-release/firmware/tests/stipple_tests ShopScripts.WriteDefaultAppFramesOnRequest
          python3 tooling/site/build-previews.py build/frames-defaults site/defaults

      - name: Assemble
        run: |
          set -euo pipefail
          mkdir -p dist/api dist/shop dist/scripting dist/mqtt

          cp site/index.html site/stipple.css site/stipple.js site/frames.js              site/favicon.svg site/docs.css dist/
          cp site/api/index.html dist/api/
          cp site/shop/index.html site/shop/shop.css dist/shop/
          cp site/shop/*.gif dist/shop/
          cp site/banner.svg dist/
          mkdir -p dist/defaults
          cp site/defaults/*.gif dist/defaults/
          cp site/scripting/index.html dist/scripting/
          cp site/mqtt/index.html dist/mqtt/

          # Redoc fetches the specification at runtime, so it has to sit
          # beside the page that asks for it.
          cp docs/openapi.yaml dist/api/

          # Pages runs Jekyll otherwise, which eats files beginning with an
          # underscore and is not wanted for a hand-built site.
          touch dist/.nojekyll

          # Every page the nav links to must exist, or the site ships with a
          # dead link that looks like a broken deploy. Checked here rather
          # than trusted, because the copy list above is by name and adding a
          # page without adding a line is the easy mistake - it is how
          # /shop/ 404'd the first time.
          for page in index.html api/index.html shop/index.html                       scripting/index.html mqtt/index.html; do
            test -f "dist/$page" || { echo "missing: $page" >&2; exit 1; }
          done

          # Every preview the shop page references must exist. A card with a
          # broken image looks like a broken script, which is the opposite of
          # what the page is for.
          missing=0
          for src in $(grep -o 'src="[a-z0-9-]*\.gif"' dist/shop/index.html | cut -d'"' -f2); do
            test -f "dist/shop/$src" || { echo "missing preview: $src" >&2; missing=1; }
          done
          [ "$missing" -eq 0 ] || exit 1

          echo "--- what will be published ---"
          find dist -type f | sort
          du -sh dist

      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
